<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots project by Dylan Woolf" />
    <meta name="author" content="Dylan Woolf" />
    <meta
      name="keywords"
      content="HTML, CSS, Image sharing, Spots, Tripleten, project"
    />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/logo.svg" alt="spots logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/avatar.jpg"
            alt="current user's avatar image"
            class="profile__avatar"
          />
          <div class="profile__column">
            <h1 class="profile__title">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button class="profile__edit-btn" type="button">
              <img
                src="./images/edit.svg"
                alt="pencil icon"
                class="profile__edit-btn-img"
              />
              <span class="profile__edit-btn-words">Edit Profile</span>
            </button>
          </div>
          <button class="profile__add-btn" type="button">
            <img
              src="./images/plus.svg"
              class="profile__add-btn-image"
              alt="plus icon"
            />
            <span class="profile__add-btn-words">New post</span>
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-btn" type="button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button class="card__like-btn" type="button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
        <footer class="footer page__section">
          <p class="footer__paragraph">2025 &copy; Spots</p>
        </footer>

        <div id="edit-profile-modal" class="modal">
          <div class="modal__container">
            <button class="modal__close-btn" type="button"></button>
            <h2 class="modal__title">Edit Profile</h2>
            <form class="modal__form">
              <label for="profile-name-input" class="modal__label">Name</label>
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
              />
              <label for="profile-description-input" class="modal__label"
                >Description</label
              >
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
              />
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>

        <div id="new-post-modal" class="modal">
          <div class="modal__container">
            <button class="modal__close-btn" type="button"></button>
            <h2 class="modal__title">New post</h2>
            <form class="modal__form">
              <label for="card-image-input" class="modal__label"
                >Image link</label
              >
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <label for="card-caption-input" class="modal__label"
                >Caption</label
              >
              <input
                id="card-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
              />
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>
        <div id="preview-modal" class="modal modal_type_preview">
          <div class="modal__image-container">
            <button
              class="modal__close-btn modal__close-btn_type_preview"
              type="button"
            ></button>
            <img
              src="#"
              alt=""
              class="modal__image modal__image_type_preview"
            />
            <p class="modal__title_type_preview"></p>
          </div>
        </div>
      </main>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
